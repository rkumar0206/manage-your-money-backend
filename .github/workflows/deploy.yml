name: Build and Deploy Backend

on:
  push:
    branches: [ "master" ]
    paths-ignore:
      - '**.md'

# 🔑 Grants write permissions to GHCR
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/mym-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------------------
      # 1. Checkout Source Code
      # ------------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------------------
      # 2. Set up JDK 25 & Gradle Cache
      # ------------------------------------------------------------------------
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      # ------------------------------------------------------------------------
      # 3. Run Unit & Integration Tests
      # ------------------------------------------------------------------------
      - name: Run Tests
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon

      # ------------------------------------------------------------------------
      # 4. Extract Project Version from build.gradle
      # ------------------------------------------------------------------------
      - name: Extract Project Version
        id: get_version
        run: |
          VERSION=$(./gradlew properties -q | grep "^version:" | awk '{print $2}')
          echo "APP_VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted App Version: $VERSION"

      # ------------------------------------------------------------------------
      # 5. Set up Docker Buildx (Enables layer caching)
      # ------------------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ------------------------------------------------------------------------
      # 6. Log in to GitHub Container Registry (GHCR)
      # ------------------------------------------------------------------------
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------------------
      # 7. Build and Push Docker Image
      # ------------------------------------------------------------------------
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          build-args: |
            GITHUB_ACTOR=${{ github.actor }}
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.get_version.outputs.APP_VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ------------------------------------------------------------------------
      # 8. Set up Kubernetes Context (Kubeconfig)
      # ------------------------------------------------------------------------
      - name: Set up Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      # ------------------------------------------------------------------------
      # 9. Set up Helm
      # ------------------------------------------------------------------------
      - name: Set up Helm
        uses: azure/setup-helm@v4

      # ------------------------------------------------------------------------
      # 10. Deploy via Helm (Handles Namespace, Secrets, and Application)
      # ------------------------------------------------------------------------
      - name: Deploy via Helm
        run: |
          helm upgrade --install mym-backend ./helm/mym \
            --namespace mym-prod \
            --create-namespace \
            --set app.image.tag="${{ steps.get_version.outputs.APP_VERSION }}" \
            --set secrets.postgresUser="${{ secrets.POSTGRES_USER }}" \
            --set secrets.postgresPassword="${{ secrets.POSTGRES_PASSWORD }}" \
            --set secrets.jwtSecret="${{ secrets.JWT_SECRET }}" \
            --set secrets.smtpUsername="${{ secrets.SMTP_USERNAME }}" \
            --set secrets.smtpPassword="${{ secrets.SMTP_PASSWORD }}" \
            --set secrets.redisPassword="${{ secrets.REDIS_PASSWORD }}" \
            --set secrets.unsplashAccessKey="${{ secrets.UNSPLASH_ACCESS_KEY }}"