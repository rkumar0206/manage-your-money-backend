apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mym-ingress
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    app: mym
    component: ingress
  annotations:
      {{- range $key, $value := .Values.ingress.annotations }}
      {{ $key }}: {{ $value | quote }}
      {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | default "nginx" }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | default "mym.rksdev.tech" }}
  rules:
    - host: {{ .Values.ingress.host | default "mym.rksdev.tech" }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: mym-backend-service
                port:
                  number: {{ .Values.app.service.port | default 2266 }}
