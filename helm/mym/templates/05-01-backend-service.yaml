apiVersion: v1
kind: Service
metadata:
  name: mym-backend-service
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    app: mym
    component: mym-backend
spec:
  type: {{ .Values.app.service.type | default "ClusterIP" }}
  selector:
    app: mym
    component: mym-backend
  ports:
    - name: http
      port: {{ .Values.app.service.port | default 2266 }}
      targetPort: {{ .Values.app.service.targetPort | default 2266 }}
      protocol: TCP