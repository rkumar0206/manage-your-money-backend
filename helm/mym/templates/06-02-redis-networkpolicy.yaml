{{- if .Values.redis.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  name: mym-redis
spec:
  podSelector:
    matchLabels:
      app: mym
      component: mym-redis
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: mym
              component: mym-backend
      ports:
        - port: 6379
{{- end }}