spring:
  application:
    name: manage-your-money-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5466/manage_yr_money_db}
    username: ${POSTGRES_USER:rtb}
    password: ${POSTGRES_PASSWORD:rtb_temp_12345}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.xml
    default-schema: public
    drop-first: false
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

allowedOrigins: ${ALLOWED_ORIGINS:http://localhost:4200}  # frontend host url

server:
  port: 2600

jwt:
  properties:
    enabled: true
    secret: "9xA4vK2mZ8bQ5wP1rT7yC3eX6nM0vK2mZ8bQ5wP1rT7yC3eX6nM0" # Use a secure 256-bit key
    issuer: "learningos-auth-service"
    accessTokenExpirationMillis: 900000   # 15 mins
    refreshTokenExpirationMillis: 604800000 # 7 days
    secureCookies: false
    publicEndpoints:
      - "/v3/api-docs/**"
      - "/api/v1/auth/**"
      - "/actuator/**"
    roleMappings:
      - pattern: "/api/v1/admin/**"
        roles: ["ADMIN"]